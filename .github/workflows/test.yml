name: test
on: [push, pull_request]
jobs:
  test:
    name: Build and run it
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python: [3.15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python3 --version
      - run: sudo apt install -y gcc g++ gfortran libopenblas-dev liblapack-dev pkg-config
      - run: pip wheel --pre numpy
      - run: mkdir dist && mv *.whl dist/
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
